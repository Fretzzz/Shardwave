<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1758"/>
      <stop offset="1" stop-color="#120A2A"/>
    </linearGradient>
    <linearGradient id="shard" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFC4FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- refracted beams -->
  <g stroke-width="14" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="256" x2="120" y2="112" stroke="#5CF2C0"/>
    <line x1="256" y1="256" x2="404" y2="130" stroke="#FF5FA2"/>
    <line x1="256" y1="256" x2="112" y2="392" stroke="#FFD166"/>
    <line x1="256" y1="256" x2="398" y2="396" stroke="#5AC8FA"/>
  </g>

  <!-- shard body -->
  <polygon points="256,84 356,256 256,428 156,256" fill="url(#shard)"/>

  <!-- facet line -->
  <line x1="256" y1="84" x2="256" y2="428" stroke="#B9A9FF" stroke-width="6" opacity="0.55"/>
</svg>
